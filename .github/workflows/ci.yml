name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIAGE_LLM: "off"   # CI is offline and deterministic; LLM evals run separately with a budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Eval regression gate
        run: python -m triage eval --gate evals/thresholds.json
      - name: Eval report in job summary
        if: always()
        run: cat reports/eval_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
